[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comicomi-pipeline"
version = "0.1.0"
description = "comicomi batch pipeline: Rakuten Books ingest, embeddings and similarity precomputation"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "sentence-transformers>=3.0",
    "supabase>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[project.scripts]
comicomi = "comicomi_pipeline.cli:app"

[tool.setuptools]
packages = ["comicomi_pipeline"]

[tool.setuptools.package-data]
comicomi_pipeline = ["tag_rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
packages = ["comicomi_pipeline"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "supabase", "supabase.*", "postgrest", "postgrest.*", "yaml"]
ignore_missing_imports = true
